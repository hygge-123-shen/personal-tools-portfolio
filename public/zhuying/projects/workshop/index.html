<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f2" />
  <meta name="description" content="把编程知识变成有趣的小作品。数智创作工坊，课程学习与灵感展示的空间。" />
  <title>数智创作工坊</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="local-api.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="数智创作工坊首页">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span class="brand-name">创作<span>工坊</span></span>
      </a>
      <div class="side-label">工作空间</div>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>发现灵感</button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">▦</span>创作任务</button>
        <button class="nav-item" data-view="gallery"><span class="nav-icon">▧</span>作品广场</button>
        <button class="nav-item" data-view="mine"><span class="nav-icon">◉</span>我的创作</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="course-card"><div class="course-icon">✳</div><div><strong>数智编程技术</strong><span>基础及应用 · 课程空间</span></div><span class="course-arrow">↗</span></div>
        <div class="profile"><div class="avatar">同</div><div class="profile-copy"><strong>同学你好</strong><span>今天也来创作吧</span></div><button class="more-button" aria-label="更多选项">···</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>课程空间</span><span class="crumb-divider">/</span><strong id="current-section">发现灵感</strong></div>
        <div class="topbar-actions"><span class="today-label" id="today-label"></span><button class="avatar small" title="当前用户">同</button></div>
      </header>
      <div id="view-root" class="view-root"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
